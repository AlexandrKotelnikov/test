<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">LLM Navigation Lab</title>
  <desc id="desc">Navigation protocols for long-running AI agents using Delivery, Evidence and Alignment coordinates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#0b1d2e"/>
      <stop offset="1" stop-color="#102b3b"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#57d3ff"/>
      <stop offset="1" stop-color="#7bf0b5"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <g opacity="0.15" stroke="#8ddcff" stroke-width="1">
    <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200"/>
    <path d="M80 0V520M160 0V520M240 0V520M320 0V520M400 0V520M480 0V520M560 0V520M640 0V520M720 0V520M800 0V520M880 0V520M960 0V520M1040 0V520M1120 0V520"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#eef8ff">
    <text x="72" y="118" font-size="26" font-weight="700" letter-spacing="3" fill="#7bf0b5">OPEN RESEARCH PROJECT</text>
    <text x="72" y="190" font-size="58" font-weight="800">LLM Navigation Lab</text>
    <text x="72" y="244" font-size="25" fill="#b8d4e5">Teach long-running AI agents to know where they are,</text>
    <text x="72" y="279" font-size="25" fill="#b8d4e5">what evidence is missing, and when to stop.</text>
    <g transform="translate(72 332)">
      <rect width="168" height="50" rx="25" fill="#12384a" stroke="#57d3ff"/>
      <text x="84" y="32" text-anchor="middle" font-size="18" font-weight="700">Delivery</text>
      <rect x="184" width="168" height="50" rx="25" fill="#12384a" stroke="#7bf0b5"/>
      <text x="268" y="32" text-anchor="middle" font-size="18" font-weight="700">Evidence</text>
      <rect x="368" width="168" height="50" rx="25" fill="#12384a" stroke="#f3c969"/>
      <text x="452" y="32" text-anchor="middle" font-size="18" font-weight="700">Alignment</text>
    </g>
    <text x="72" y="440" font-size="17" fill="#8eb3c7">Portable skills · reproducible benchmarks · honest null results</text>
  </g>
  <g transform="translate(760 68)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <circle cx="200" cy="200" r="174" fill="#0b1828" stroke="#2a6078" stroke-width="2"/>
    <circle cx="200" cy="200" r="116" fill="none" stroke="#23485b"/>
    <circle cx="200" cy="200" r="58" fill="none" stroke="#23485b"/>
    <path d="M200 200L200 24M200 200L49 288M200 200L351 288" stroke="#5f8498" stroke-width="2"/>
    <text x="200" y="14" text-anchor="middle" fill="#57d3ff" font-size="20" font-weight="700">D</text>
    <text x="31" y="310" text-anchor="middle" fill="#7bf0b5" font-size="20" font-weight="700">E</text>
    <text x="369" y="310" text-anchor="middle" fill="#f3c969" font-size="20" font-weight="700">A</text>
    <polyline points="90,270 123,235 150,248 174,190 210,161 246,126 287,84" fill="none" stroke="url(#route)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="90" cy="270" r="11" fill="#ff7d8a"/>
    <circle cx="150" cy="248" r="9" fill="#f3c969"/>
    <circle cx="287" cy="84" r="14" fill="#7bf0b5" filter="url(#glow)"/>
    <text x="72" y="302" fill="#ff9ca6" font-size="15">start</text>
    <text x="298" y="78" fill="#9bf7c6" font-size="15" font-weight="700">accepted result</text>
    <text x="135" y="278" fill="#f3c969" font-size="14">cross-track</text>
  </g>
</svg>

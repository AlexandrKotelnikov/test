<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">LLM Navigation Lab</title>
  <desc id="desc">Portable navigation skills and reproducible benchmarks for long-running AI agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101c"/>
      <stop offset="0.6" stop-color="#0a2031"/>
      <stop offset="1" stop-color="#11384a"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#59d8ff"/>
      <stop offset="1" stop-color="#7bf0b5"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <g opacity=".12" stroke="#8ddcff"><path d="M0 80H1280M0 160H1280M0 240H1280M0 320H1280M0 400H1280M0 480H1280M0 560H1280"/><path d="M80 0V640M160 0V640M240 0V640M320 0V640M400 0V640M480 0V640M560 0V640M640 0V640M720 0V640M800 0V640M880 0V640M960 0V640M1040 0V640M1120 0V640M1200 0V640"/></g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="72" y="116" fill="#7bf0b5" font-size="24" font-weight="800" letter-spacing="4">OPEN RESEARCH · INTERACTIVE DEMO</text>
    <text x="72" y="208" fill="#eef8ff" font-size="68" font-weight="850">LLM Navigation Lab</text>
    <text x="72" y="266" fill="#b9d4e4" font-size="28">Keep long-running AI agents moving toward</text>
    <text x="72" y="305" fill="#b9d4e4" font-size="28">the result a user will actually accept.</text>
    <g transform="translate(72 365)">
      <rect width="180" height="54" rx="27" fill="#102c3d" stroke="#59d8ff"/><text x="90" y="35" text-anchor="middle" fill="#eef8ff" font-size="19" font-weight="700">Delivery</text>
      <rect x="198" width="180" height="54" rx="27" fill="#102c3d" stroke="#7bf0b5"/><text x="288" y="35" text-anchor="middle" fill="#eef8ff" font-size="19" font-weight="700">Evidence</text>
      <rect x="396" width="180" height="54" rx="27" fill="#102c3d" stroke="#f4cb72"/><text x="486" y="35" text-anchor="middle" fill="#eef8ff" font-size="19" font-weight="700">Alignment</text>
    </g>
    <text x="72" y="502" fill="#90b2c5" font-size="19">Portable skills · honest benchmarks · zero-dependency simulator</text>
    <text x="72" y="555" fill="#59d8ff" font-size="20" font-weight="700">github.com/AlexandrKotelnikov/llm-navigation-lab</text>
  </g>
  <g transform="translate(860 92)">
    <circle cx="190" cy="220" r="180" fill="#071522" stroke="#2d6178" stroke-width="2"/>
    <circle cx="190" cy="220" r="120" fill="none" stroke="#23485b"/><circle cx="190" cy="220" r="60" fill="none" stroke="#23485b"/>
    <path d="M190 220L190 40M190 220L34 310M190 220L346 310" stroke="#67899c" stroke-width="2"/>
    <polyline points="70,300 108,270 144,278 166,220 210,184 246,140 300,84" fill="none" stroke="url(#route)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="70" cy="300" r="12" fill="#ff7f8e"/><circle cx="144" cy="278" r="10" fill="#f4cb72"/><circle cx="300" cy="84" r="15" fill="#7bf0b5" filter="url(#glow)"/>
    <text x="310" y="78" fill="#9cf8c7" font-family="sans-serif" font-size="16" font-weight="700">LANDING</text>
  </g>
</svg>
